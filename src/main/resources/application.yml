spring:
  application:
    name: movie-ticket-booking
  datasource:
    url: jdbc:h2:file:./data/movieticket;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

booking:
  hold-ttl-seconds: 300
  hold-sweep-interval-ms: 30000
  reminder-lead-hours: 2
  reminder-scan-interval-ms: 300000

logging:
  level:
    com.assignment.movieticket: INFO
