spring:
  datasource:
    url: jdbc:h2:mem:movieticket-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

booking:
  hold-ttl-seconds: 2
  hold-sweep-interval-ms: 1000
  reminder-lead-hours: 2
  reminder-scan-interval-ms: 600000

logging:
  level:
    com.assignment.movieticket: DEBUG
